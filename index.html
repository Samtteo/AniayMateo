<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para la Persona que me devolvió el Brillo</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            text-align: center;
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            max-width: 600px;
            margin: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            font-size: 28px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #f0f0f0;
        }
        h2 {
            font-size: 22px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(45deg, #ff6f61, #ff2e63);
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin-top: 20px;
            border-radius: 25px;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(255, 46, 99, 0.3);
        }
        .btn:hover {
            background: linear-gradient(45deg, #ff2e63, #ff6f61);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 46, 99, 0.5);
        }
        .heart {
            color: #ff2e63;
            font-size: 24px;
            animation: heartbeat 1.5s infinite;
        }
        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Para mi hermosa Ania, el amorcito mío <span class="heart">❤️</span></h1>
        <img src="URL_DE_TU_IMAGEN" alt="Imagen especial">
        <p>
            Mi amor, cada día contigo es un regalo. Y pues como es costumbre, no me puedo quedar con los brazos cruzados...
        </p>
        <h2>¿Quieres ser esa persona especial que me acompañe en San Valentín? <span class="heart">❤️</span></h2>
        <a class="btn" href="respuesta.html">¡Sí, claro!</a>
    </div>
</body>
</html>
