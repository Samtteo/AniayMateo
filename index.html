<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para la Persona que me devolvió el Brillo</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            text-align: center;
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .container {
            max-width: 600px;
            margin: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 2;
        }
        img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            font-size: 28px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #f0f0f0;
        }
        h2 {
            font-size: 22px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(45deg, #ff6f61, #ff2e63);
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin-top: 20px;
            border-radius: 25px;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(255, 46, 99, 0.3);
        }
        .btn:hover {
            background: linear-gradient(45deg, #ff2e63, #ff6f61);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 46, 99, 0.5);
        }
        .heart {
            color: #ff2e63;
            font-size: 24px;
            animation: heartbeat 1.5s infinite;
        }
        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        /* Estrellas brillantes */
        .star {
            position: absolute;
            width: 6px; /* Más grandes */
            height: 6px; /* Más grandes */
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.9); /* Más brillo */
            animation: twinkle 2s infinite ease-in-out;
            z-index: 1;
        }
        @keyframes twinkle {
            0%, 100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }

        /* GIFs animados */
        .gif {
            position: absolute;
            width: 150px; /* Tamaño más grande */
            height: auto;
            z-index: 1;
            animation: float 6s infinite ease-in-out;
        }
        .gif-1 {
            top: 5%;
            left: 5%;
        }
        .gif-2 {
            top: 10%;
            right: 5%;
            animation-duration: 8s;
        }
        .gif-3 {
            bottom: 5%;
            left: 10%;
            animation-duration: 7s;
        }
        .gif-4 {
            bottom: 15%;
            right: 10%;
            animation-duration: 9s;
        }
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body>
   <audio id="musica" loop>
    <source src="valentin.mp3" type="audio/mpeg">
</audio>

<button id="playButton" onclick="playMusic()">🎵 Play</button>

<style>
    #playButton {
        background: linear-gradient(45deg, #ff6f61, #ff2e63);
        color: white;
        font-size: 18px;
        padding: 12px 24px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 4px 10px rgba(255, 46, 99, 0.3);
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: bold;
        transform: translateX(-150px);
    }

    #playButton:hover {
        background: linear-gradient(45deg, #ff2e63, #ff6f61);
        transform: scale(1.05);
        box-shadow: 0 6px 15px rgba(255, 46, 99, 0.5);
        transform: translateX(-150px);
    }
    }
</style>

<script>
    function playMusic() {
        const audio = document.getElementById('musica');
        if (audio.paused) {
            audio.play();
            document.getElementById('playButton').textContent = "⏸️ Stop";
        } else {
            audio.pause();
            document.getElementById('playButton').textContent = "🎵 Play";
        }
    }
</script>
