<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias, mi amorcito! 💖</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            text-align: center;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .container {
            max-width: 500px;
            margin: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            position: relative;
            z-index: 2;
        }
        h1 {
            font-size: 24px;
            color: #ff6f61;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }
        img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* Estrellas brillantes */
        .star {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
            animation: twinkle 2s infinite ease-in-out;
            z-index: 1;
        }
        @keyframes twinkle {
            0%, 100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }

        /* GIFs animados */
        .gif {
            position: absolute;
            width: 150px;
            height: auto;
            z-index: 1;
            animation: float 6s infinite ease-in-out;
        }
        .gif-1 {
            top: 5%;
            left: 5%;
        }
        .gif-2 {
            top: 10%;
            right: 5%;
            animation-duration: 8s;
        }
        .gif-3 {
            bottom: 5%;
            left: 10%;
            animation-duration: 7s;
        }
        .gif-4 {
            bottom: 15%;
            right: 10%;
            animation-duration: 9s;
        }
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body>
    <!-- Estrellas brillantes (muchas más y más grandes) -->
    <div class="star" style="top: 5%; left: 10%;"></div>

    <!-- GIFs animados de San Valentín -->

    <img src="https://media.giphy.com/media/jtFi4jhsjyHcwQEEKM/giphy.gif?cid=790b7611662k20j56wh603mzosygx0mahry3gdgc87rxt2n9&ep=v1_gifs_search&rid=giphy.gif&ct=g" alt="Cupido mágico" class="gif gif-3">

</body>
